services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: backpagenew
      POSTGRES_USER: backpagenew
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U backpagenew']
      interval: 5s
      retries: 10
    restart: unless-stopped
  valkey:
    image: valkey/valkey:8-alpine
    command: [valkey-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes:
      - queue_data:/data
    restart: unless-stopped
  migrate:
    build: .
    env_file: .env
    command: [npm, run, migrate]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: [npm, run, worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    mem_limit: 768m
    cpus: 1
    restart: unless-stopped
volumes:
  postgres_data:
  queue_data:
