services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: bpn_test
      POSTGRES_USER: bpn_test
      POSTGRES_PASSWORD: test-only-password
    tmpfs: ['/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bpn_test']
      interval: 2s
      retries: 20
  redis:
    image: valkey/valkey:8-alpine
  tests:
    build: .
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://bpn_test:test-only-password@db:5432/bpn_test
      REDIS_URL: redis://redis:6379
      SITE_ORIGIN: https://public.example.com
      ADMIN_ORIGIN: https://admin.example.com
      INTEGRATION_TEST: '1'
      ADMIN_VPN_IP: 192.0.2.10
    volumes: ['./test:/app/test:ro']
    command: ['sh','-c','node src/migrate.mjs && node --test test/live-admin.test.mjs && node --test test/security-gate.test.mjs test/geo-policy.test.mjs && node --test test/vpn.test.mjs && node --test test/feed.test.mjs && node --test test/storage.test.mjs && node --test test/edge-sync.test.mjs && node --test test/picture-upload.test.mjs && node --test test/team.test.mjs && node --test test/account-security.test.mjs']
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
