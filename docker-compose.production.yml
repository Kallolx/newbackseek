services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backpagenew-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
    # Caddy will later be the only public entry point. Keeping this local
    # lets us test safely before moving the domain from Vercel.
    ports:
      - '127.0.0.1:3000:3000'

  caddy:
    image: caddy:2.10-alpine
    container_name: backpagenew-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
