services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    container_name: backpagenew-frontend
    volumes:
      - public_static:/app/static-archive
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      # Server-rendered listings read the API directly on the private network.
      API_INTERNAL_URL: http://api:4000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    # Caddy will later be the only public entry point. Keeping this local
    # lets us test safely before moving the domain from Vercel.
    ports:
      - '127.0.0.1:3000:3000'

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    container_name: backpagenew-admin
    volumes:
      - admin_static:/app/static-archive
    restart: unless-stopped
    profiles: ['admin']
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '127.0.0.1:3001:3001'

  db:
    image: postgres:18
    profiles: ['backend']
    env_file: ./backend/.env
    # Tuned for the 6 vCPU / 6 GB VPS (stock Postgres assumes 128 MB of cache).
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2560MB
      - -c
      - work_mem=12MB
      - -c
      - maintenance_work_mem=192MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_buffers=16MB
      - -c
      - max_connections=100
    shm_size: 256mb
    environment:
      POSTGRES_DB: backpagenew
      POSTGRES_USER: backpagenew
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U backpagenew']
      interval: 5s
      retries: 12
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    profiles: ['backend']
    command: [valkey-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes:
      - queue_data:/data
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    profiles: ['backend']
    env_file: ./backend/.env
    command: [sh, -c, 'npm run migrate && node src/seed.mjs']
    volumes:
      - ./src/directory:/src/directory:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
    container_name: backpagenew-api
    restart: unless-stopped
    profiles: ['backend']
    env_file: ./backend/.env
    environment:
      # Tells the public site to refresh cached pages when ads change.
      FRONTEND_INTERNAL_URL: http://frontend:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    ports:
      - '127.0.0.1:4000:4000'

  worker:
    build:
      context: ./backend
    container_name: backpagenew-worker
    restart: unless-stopped
    profiles: ['backend']
    env_file: ./backend/.env
    command: [npm, run, worker]
    environment:
      IMAGE_WORKER_CONCURRENCY: '4'
    mem_limit: 1536m
    cpus: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_started

  caddy:
    image: caddy:2.10-alpine
    container_name: backpagenew-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - public_static:/srv/static/public:ro
      - admin_static:/srv/static/admin:ro

volumes:
  public_static:
  admin_static:
  caddy_data:
  caddy_config:
  postgres_data:
  queue_data:
